# import-linter template for a Python repo with hexagonal architecture.
# Copy it to the root as .importlinter and run:
#   lint-imports --config .importlinter
#
# Adapt the names to your repo:
#   - root_package: the root package (here "app").
#   - app.core: domain, use cases and ports.
#   - app.adapters: driving and driven adapters.
# If the core and the adapters do not hang from "app", change every path.

[importlinter]
root_package = app
# Needed to watch imports of external libraries (sqlalchemy, requests, etc.).
include_external_packages = True

[importlinter:contract:layers]
name = Adapters depend on the core, never the other way round
type = layers
# From top to bottom: each layer may import the ones below, not the reverse.
layers =
    app.adapters
    app.core

[importlinter:contract:core-without-io]
name = The core does not import IO libraries or frameworks
type = forbidden
source_modules =
    app.core
forbidden_modules =
    sqlalchemy
    psycopg2
    pymongo
    redis
    requests
    httpx
    boto3
    fastapi
    flask
    django

# The layers contract treats app.adapters as a single layer. These two
# contracts stop imports between the two families. Imports between adapters
# of the same family are not checked here: the skill audit reports them. To
# check them in CI too, declare one module per adapter that lives in its own
# package and use an `independence` contract:
#   [importlinter:contract:driven-independent]
#   type = independence
#   modules =
#       app.adapters.driven.sql
#       app.adapters.driven.memory
[importlinter:contract:driving-without-driven]
name = Driving adapters do not import driven adapters
type = forbidden
source_modules =
    app.adapters.driving
forbidden_modules =
    app.adapters.driven

[importlinter:contract:driven-without-driving]
name = Driven adapters do not import driving adapters
type = forbidden
source_modules =
    app.adapters.driven
forbidden_modules =
    app.adapters.driving
