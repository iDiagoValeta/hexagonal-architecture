# CI template to fix the dependency direction.
# Copy it to .github/workflows/architecture.yml, uncomment the job for your
# language and delete the others.
#
# Every job is commented out on purpose: a workflow with no active jobs
# does not run, so do not leave it like this on the main branch.
# The workflow only reads the repo: permissions contents read.

name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Python: import-linter
  # Requires .importlinter at the root (see assets/python/importlinter.ini).
  #
  # python:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: Install the project and the linter
  #       run: |
  #         pip install -e .
  #         pip install import-linter
  #     - name: Check contracts
  #       run: lint-imports --config .importlinter

  # TypeScript: dependency-cruiser
  # Requires .dependency-cruiser.cjs (see assets/typescript/).
  # dependency-cruiser 18.7 needs TypeScript 6 or earlier: with TypeScript 7
  # it does not traverse modules, warns and exits with 0. The module count
  # guard below turns that false green into a failure.
  #
  # typescript:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "22"
  #         cache: npm
  #     - run: npm ci
  #     - name: Check dependencies
  #       run: |
  #         npx depcruise src --config .dependency-cruiser.cjs --output-type json > dependencies.json
  #         node -e "const r = require('./dependencies.json'); if (!r.modules || r.modules.length === 0) { console.error('dependency-cruiser analyzed no modules'); process.exit(1); }"

  # Java: ArchUnit
  # Requires HexagonalArchitectureTest.java under src/test/java (see assets/java/).
  #
  # java:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: "21"
  #         cache: maven
  #     - name: Check architecture
  #       run: mvn -B test -Dtest=HexagonalArchitectureTest

  # Go: go-arch-lint
  # Requires .go-arch-lint.yml at the root (see assets/go/).
  # go-arch-lint 1.19 needs Go 1.25 or later: the job pins Go 1.25 instead of
  # reading go.mod, which may declare an earlier version.
  #
  # go:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version: "1.25"
  #         cache: true
  #     - name: Install go-arch-lint
  #       run: |
  #         go install github.com/fe3dback/go-arch-lint@v1.19.0
  #         echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
  #     - name: Check components
  #       run: go-arch-lint check
